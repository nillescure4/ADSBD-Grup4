[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adsbd-grup4"
version = "0.1.0"
description = "Pipeline local de gestio de dades per zones amb MinIO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "Pillow>=10.0,<11",
  "pandas>=2.0,<3",
  "opencv-python>=4.8,<5",
  "imagehash>=4.3,<5",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

