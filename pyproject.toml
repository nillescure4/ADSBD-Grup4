[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adsbd-grup4"
version = "0.1.0"
description = "Pipeline local de gestio de dades per zones amb MinIO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "pyarrow>=18,<24",
  "Pillow>=10.0,<11",
  "pandas>=2.0,<3",
  "opencv-python>=4.8,<5",
  "imagehash>=4.3,<5",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.42,<2",
  "graphviz>=0.20,<1",
  "chromadb>=1.0,<2",
  "transformers==4.48.3",
  "huggingface-hub>=0.26,<1",
  "einops>=0.8,<0.9",
  "sentencepiece>=0.2,<0.3",
  "timm>=1.0,<2",
  "accelerate>=1,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]
embeddings = [
  "chromadb>=1.0,<2",
  "transformers==4.48.3",
  "huggingface-hub>=0.26,<1",
  "einops>=0.8,<0.9",
  "sentencepiece>=0.2,<0.3",
  "timm>=1.0,<2",
  "accelerate>=1,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
