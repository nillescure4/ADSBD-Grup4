# Source collections used by the multimodal pipeline.
datasets:
  rawg_texts:
    source: rawg
    modality: text
    directory: text_descriptions
    raw_format: json

  rawg_images:
    source: rawg
    modality: image
    directory: rawg_full
    raw_format: mixed_image

  opengameart_audio:
    source: opengameart
    modality: audio
    directory: opengameart_audio/raw/files
    raw_format: mixed_audio

