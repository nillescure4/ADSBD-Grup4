services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - .env
    command: server /data --console-address ":9001"

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-init
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000
      \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/1.landing-zone;
      /usr/bin/mc mb --ignore-existing local/2.formatted-zone;
      /usr/bin/mc mb --ignore-existing local/3.trusted-zone;
      "

volumes:
  minio_data:
